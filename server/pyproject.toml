[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replication-insights"
version = "0.1.0"
description = "Read-only simulated replication insights MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.2.4",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
replication-insights = "replication_insights.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "cryptography>=45",
    "PyJWT[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
